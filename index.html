<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vollkorn</title>
    <link rel="stylesheet" href="stylesheets/style.css" />
  </head>
  <body>
    <section class="section1">
      <div class="birds"><img src="images/birds.svg" alt="" /></div>
      <div><img src="images/circlemolochny.svg" alt="" /></div>
    </section>
    <section class="section2">
      <div class="sign">
        <div class="signinsign">
          <div class="textinsignsign"><h2>Добро пожаловать!</h2></div>
        </div>
        <div class="vollkorn1"><img src="images/vollkorn.svg" alt="" /></div>
      </div>
      <div class="seno"><img src="images/seno.svg" alt="" /></div>
      <div class="grass"><img src="images/grasscircle.svg" alt="" /></div>
      <div class="doska1"></div>
      <div class="doska2"></div>
      <div class="doska3"></div>
      <div class="doska4"></div>
      <div class="doska5"></div>
      <div class="doska6"></div>
      <div class="doska7"></div>
      <div class="doska8"></div>
      <div class="cows"><img src="images/twocows.svg" alt="" /></div>
      <div class="flowers"><img src="images/flowers.svg" alt="" /></div>
    </section>
    <section class="section3">
      <div class="doska9"></div>
      <div class="doskabig">
        <img src="images/doskabig.svg" alt="" />
      </div>
      <div class="text1">О шрифте</div>
      <div class="text2">
        Vollkorn - шрифтовая гарнитура <br />
        с засечками, разработанная Фридрихом Альтхаузенном. Задуман как
        <br />спокойный, скромный шрифт.
      </div>
      <div class="text3">
        В 2010 году Vollkorn вошел в число первых шрифтов Google Fonts.
      </div>
      <div class="cloud1"><img src="images/cloud1.svg" alt="" /></div>
      <div class="cloud2"><img src="images/cloud2.svg" alt="" /></div>
    </section>
    <section class="section4">
      <div class="grasssmall"><img src="images/grasssmall.svg" alt="" /></div>
      <div class="circlemolochny1">
        <img src="images/circlemolochny.svg" alt="" />
      </div>
      <div class="bayan"><img src="images/bayan.svg" alt="" /></div>
      <div class="doska10">
        <span class="span1">Шрифт</span> <span class="span2">легко</span>
        <span class="span3">читается</span> <span class="span4">в</span>
        <span class="span5">любом</span>
        <span class="span6">стиле</span>
      </div>
      <div class="circlemolochny2">
        <img src="images/circlemolochny.svg" alt="" />
      </div>
    </section>
    <section class="section5"></section>
